<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ветровка Flow, вид сбоку">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16212a"/><stop offset="1" stop-color="#0e1216"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#6cc4f0" stop-opacity=".2"/><stop offset="1" stop-color="#6cc4f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a87a4"/><stop offset=".55" stop-color="#356a86"/><stop offset="1" stop-color="#244c60"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b586d"/><stop offset="1" stop-color="#1d3f50"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <ellipse cx="400" cy="548" rx="160" ry="20" fill="#000" opacity=".38"/>

  <!-- body profile -->
  <path d="M356 208 C330 226 320 278 322 342 L324 500 L486 500 L490 402 C492 318 476 246 446 208 Z" fill="url(#cloth)"/>
  <path d="M356 208 C378 196 424 196 446 208 L452 296 C420 312 382 312 350 296 Z" fill="url(#sheen)"/>

  <!-- near sleeve -->
  <path d="M442 212 C472 226 488 272 492 334 L496 402 C497 424 484 436 464 434 L438 428 L432 300 Z" fill="url(#cloth)" stroke="#275268" stroke-width="2" stroke-opacity=".6"/>
  <path d="M437 404 L497 410 L495 438 L434 432 Z" fill="#22495c"/>

  <!-- folded hood behind collar -->
  <path d="M392 198 C398 168 426 152 456 160 C470 164 478 178 480 194 C468 202 448 206 428 202 Z" fill="url(#dark)" opacity=".95"/>

  <!-- collar -->
  <path d="M400 200 C420 190 442 190 454 200 C460 212 450 224 434 226 C418 228 404 220 400 208 Z" fill="url(#dark)"/>
  <path d="M406 202 C422 194 440 194 450 202" fill="none" stroke="#7fb9d4" stroke-width="4" opacity=".65"/>

  <!-- zipper at front edge -->
  <path d="M478 232 C486 300 486 400 480 500" stroke="#16323f" stroke-width="7" fill="none"/>
  <path d="M478 232 C486 300 486 400 480 500" stroke="#8fd3f4" stroke-width="2.2" stroke-dasharray="6 5" fill="none"/>
  <rect x="478" y="238" width="15" height="28" rx="5" fill="#b9dcea"/>

  <!-- pocket -->
  <path d="M452 366 C472 370 480 386 478 404 L474 430" fill="none" stroke="#1d3f50" stroke-width="6" stroke-linecap="round"/>

  <!-- hem -->
  <path d="M326 480 L484 480 L486 498 C487 507 480 512 470 512 L334 512 C324 512 317 507 318 498 Z" fill="#1d3f50"/>

  <rect x="428" y="496" width="54" height="20" rx="3" fill="#0d161b" opacity=".85"/>
  <text x="455" y="511" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8fd3f4" text-anchor="middle" letter-spacing="1">FLOW</text>
</svg>
