  <rect x="235" y="400" width="72" height="40" rx="16" transform="rotate(-7 271 420)" fill="#22495c"/>
  <rect x="495" y="400" width="72" height="40" rx="16" transform="rotate(7 531 420)" fill="#22495c"/>

  <!-- body -->
  <path d="M320 202 C350 184 450 184 480 202 L508 470 C510 494 496 508 472 510 L328 510 C304 508 290 494 292 470 Z" fill="url(#cloth)"/>
  <path d="M320 202 C350 184 450 184 480 202 L490 310 C440 334 360 334 310 310 Z" fill="url(#sheen)"/>

  <!-- collar -->
  <path d="M338 200 C346 182 372 174 400 174 C428 174 454 182 462 200 C452 214 426 220 400 220 C374 220 348 214 338 200 Z" fill="url(#dark)"/>
