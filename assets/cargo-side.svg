<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Брюки-карго Vector, вид сбоку">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#271a19"/><stop offset="1" stop-color="#131011"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#e07a86" stop-opacity=".2"/><stop offset="1" stop-color="#e07a86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5685c"/><stop offset=".55" stop-color="#9a5146"/><stop offset="1" stop-color="#7c3d35"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a463c"/><stop offset="1" stop-color="#6c332c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <ellipse cx="400" cy="552" rx="152" ry="20" fill="#000" opacity=".38"/>

  <!-- far leg hint -->
  <path d="M330 212 L346 216 L350 500 L336 504 C330 504 327 500 327 494 Z" fill="#6c332c" opacity=".85"/>

  <!-- near leg -->
  <path d="M330 196 L470 196 L474 484 C474 498 466 506 454 506 L344 506 C332 506 326 498 326 484 Z" fill="url(#cloth)"/>
  <path d="M330 196 L470 196 L472 242 L328 242 Z" fill="url(#sheen)"/>

  <!-- side cargo pocket -->
  <rect x="372" y="288" width="58" height="86" rx="8" fill="none" stroke="#74382f" stroke-width="6"/>
  <path d="M372 314 L430 314" stroke="#74382f" stroke-width="6"/>
  <rect x="392" y="300" width="18" height="7" rx="3.5" fill="#6c332c"/>

  <!-- waistband -->
  <path d="M330 150 L470 150 L474 196 L326 196 Z" fill="url(#dark)"/>
  <path d="M330 158 L470 158" stroke="#6f352e" stroke-width="4"/>
  <rect x="348" y="162" width="18" height="22" rx="3" fill="#5a2a24"/>
  <rect x="440" y="162" width="18" height="22" rx="3" fill="#5a2a24"/>

  <!-- crease and cuff -->
  <path d="M386 244 L384 476" stroke="#7c3d35" stroke-width="3" opacity=".65"/>
  <path d="M326 480 L474 480 L474 500 C474 508 468 512 460 512 L340 512 C332 512 326 508 326 500 Z" fill="#713730"/>

  <rect x="424" y="498" width="56" height="20" rx="3" fill="#1a1113" opacity=".8"/>
  <text x="452" y="513" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#f3b6bc" text-anchor="middle" letter-spacing="1">VECTOR</text>
</svg>
