<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Футболка Pulse, вид сбоку">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2218"/><stop offset="1" stop-color="#111210"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".58">
      <stop offset="0" stop-color="#c8ff4d" stop-opacity=".2"/><stop offset="1" stop-color="#c8ff4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a57"/><stop offset=".55" stop-color="#2e2e38"/><stop offset="1" stop-color="#1d1d25"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <ellipse cx="400" cy="548" rx="158" ry="20" fill="#000" opacity=".38"/>

  <!-- body profile -->
  <path d="M358 190 C334 212 324 268 326 340 L326 500 L478 500 L480 360 C482 286 466 214 444 190 Z" fill="url(#cloth)" stroke="#5e5e6c" stroke-width="2.5" stroke-opacity=".4"/>
  <path d="M358 190 C380 180 422 180 444 190 L450 282 C418 298 382 298 352 282 Z" fill="url(#sheen)"/>

  <!-- short sleeve -->
  <path d="M436 194 C470 202 494 224 502 252 L508 284 C510 300 496 310 480 306 L438 292 L432 240 Z" fill="url(#cloth)" stroke="#5e5e6c" stroke-width="2.5" stroke-opacity=".4"/>
  <path d="M438 292 C458 300 486 300 506 288" fill="none" stroke="#15151b" stroke-width="4"/>
  <path d="M436 204 C430 232 430 266 438 292" fill="none" stroke="#15151b" stroke-width="3" opacity=".8"/>

  <!-- collar profile -->
  <path d="M404 186 C426 188 442 198 448 212 C440 222 424 226 410 224 C402 210 400 198 404 186 Z" fill="#0b0b0e"/>
  <path d="M406 188 C424 190 438 199 444 211" fill="none" stroke="#c8ff4d" stroke-width="4" stroke-linecap="round"/>

  <!-- accent at front edge -->
  <rect x="466" y="266" width="9" height="10" rx="4.5" fill="#c8ff4d"/>
  <rect x="466" y="284" width="6" height="6" rx="3" fill="#c8ff4d" opacity=".55"/>

  <!-- hem -->
  <path d="M330 496 L474 496" stroke="#15151b" stroke-width="4" stroke-linecap="round"/>

  <rect x="428" y="500" width="56" height="20" rx="3" fill="#0b0b0e" opacity=".9"/>
  <text x="456" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c8ff4d" text-anchor="middle" letter-spacing="1">PULSE</text>
</svg>
